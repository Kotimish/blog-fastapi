[project]
name = "blog-fastapi"
version = "0.1.0"
description = ""
authors = [
    {name = "Mikhail Loshakov",email = "kotov.mikhail.96@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio] (>=2.0.44,<3.0.0)",
    "alembic (>=1.17.0,<2.0.0)",
    "psycopg (>=3.2.10,<4.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "aiohttp (>=3.13.0,<4.0.0)",
    "fastapi[standard] (>=0.119.0,<0.120.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.4.2,<9.0.0)"
]
