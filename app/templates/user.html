{% extends "base.html" %}

{% block title %}Профиль пользователя{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h2 class="mb-0">Профиль пользователя</h2>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Имя пользователя:</label>
                        <p class="form-control-plaintext mb-0">{{ user.username }}</p>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Электронная почта:</label>
                        <p class="form-control-plaintext mb-0">{{ user.email }}</p>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Полное имя:</label>
                        <p class="form-control-plaintext mb-0">{{ user.full_name }}</p>
                    </div>
                </div>
                <div class="card-footer text-end">
                    <a href="/users/" class="btn btn-secondary">Назад к списку пользователей</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
